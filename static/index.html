<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1d21;
    --panel: #14161a;
    --border: #2c3036;
    --text: #e8e6e1;
    --text-dim: #8b9198;
    --accent: #c9a227;
    --accent-dim: #8a7222;
    --code-bg: #101216;
    --danger: #b56357;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  body {
    margin: 0;
    font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .app { display: flex; height: 100vh; }

  .sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }

  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px 0;
  }

  .new-chat-btn {
    width: 100%;
    padding: 9px 12px;
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .new-chat-btn:hover { background: rgba(201, 162, 39, 0.08); border-color: var(--accent); }
  .new-chat-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }

  .conv-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 10px;
    border-radius: 4px;
    cursor: pointer;
    border-left: 2px solid transparent;
    margin-bottom: 2px;
  }
  .conv-item:hover { background: rgba(255,255,255,0.03); }
  .conv-item.active { background: rgba(201, 162, 39, 0.08); border-left-color: var(--accent); }
  .conv-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .conv-item-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conv-item-title::before { content: "› "; color: var(--text-dim); }

  .conv-item-meta { font-size: 11px; color: var(--text-dim); padding-left: 12px; }

  .conv-empty { color: var(--text-dim); font-size: 12.5px; padding: 10px; font-style: italic; }

  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar-title { font-size: 14px; color: var(--text-dim); }
  .topbar-title strong { color: var(--text); font-weight: 500; }

  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
  }

  .sidebar-toggle {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
  }

  .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

  .empty-state { margin: auto; text-align: center; color: var(--text-dim); max-width: 380px; }
  .empty-state-glyph { font-family: 'JetBrains Mono', monospace; font-size: 28px; color: var(--accent-dim); margin-bottom: 12px; }
  .empty-state p { font-size: 13.5px; line-height: 1.6; }

  .msg { display: flex; flex-direction: column; max-width: 78%; animation: rise 0.2s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .msg-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 5px;
    padding: 0 2px;
  }

  .msg-toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    padding: 0 2px;
  }

  .msg-bubble {
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-bubble { background: #23262b; border: 1px solid var(--border); }
  .msg.assistant .msg-bubble { background: transparent; border: 1px solid var(--border); }

  .msg-bubble pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 0;
  }
  .msg-bubble code { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .msg-bubble :not(pre) > code { background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }

  .code-block { margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .code-block pre { border: none; border-radius: 0; margin: 0; }

  .code-block-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #191c20;
    border-bottom: 1px solid var(--border);
  }
  .code-block-lang {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-right: auto;
  }
  .code-block-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 4px;
    padding: 3px 9px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .code-block-btn:hover { color: var(--accent); border-color: var(--accent-dim); }
  .code-block-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- Save-to-project confirmation modal ---------- */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 380px;
    max-width: 90vw;
  }
  .modal-title { font-size: 14.5px; font-weight: 600; margin: 0 0 8px 0; }
  .modal-hint { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 0 0 12px 0; }
  .modal-hint code { font-family: 'JetBrains Mono', monospace; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }

  .modal-input {
    width: 100%;
    background: var(--code-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .modal-input:focus { outline: none; border-color: var(--accent-dim); }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal-btn {
    padding: 7px 14px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    cursor: pointer;
  }
  .modal-btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-dim); }
  .modal-btn-cancel:hover { color: var(--text); }
  .modal-btn-confirm { background: var(--accent); border: none; color: #1a1d21; font-weight: 600; }
  .modal-btn-confirm:hover { opacity: 0.85; }
  .modal-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .typing { display: flex; gap: 4px; padding: 6px 2px; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .composer { padding: 16px 24px 22px; border-top: 1px solid var(--border); }
  .composer-inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 8px 8px 14px;
  }
  .composer-inner:focus-within { border-color: var(--accent-dim); }

  textarea {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    padding: 6px 0;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    background: var(--accent);
    color: #1a1d21;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .send-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .error-banner {
    margin: 0 24px 12px;
    padding: 10px 14px;
    background: rgba(181, 99, 87, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 6px;
    font-size: 13px;
  }

  @media (max-width: 720px) {
    .sidebar {
      position: fixed;
      z-index: 10;
      height: 100vh;
      transform: translateX(-100%);
      transition: transform 0.2s ease-out;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: inline-block; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <p class="sidebar-title">// conversations</p>
      <button class="new-chat-btn" id="newChatBtn">+ new chat</button>
    </div>
    <div class="conv-list" id="convList">
      <p class="conv-empty">No conversations yet.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <div class="topbar-title"><span class="status-dot"></span>serving <strong id="adapterName">—</strong></div>
      <div></div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-glyph">&gt;_</div>
        <p>Ask it to write a function, explain a snippet, or debug something. It remembers this conversation as you go.</p>
      </div>
    </div>

    <div id="errorBanner"></div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Message the model... (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="saveModal">
  <div class="modal">
    <p class="modal-title">Save to project</p>
    <p class="modal-hint">Writes into <code>generated_files/</code> in your project folder. Edit the path if you want a subfolder, e.g. <code>utils/helpers.py</code>.</p>
    <input type="text" id="saveModalPath" class="modal-input" spellcheck="false" autocomplete="off">
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="saveModalCancel">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="saveModalConfirm">Save file</button>
    </div>
  </div>
</div>

<script>
const state = { conversationId: null, sending: false };

const messagesEl = document.getElementById('messages');
const emptyStateEl = document.getElementById('emptyState');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const convListEl = document.getElementById('convList');
const newChatBtn = document.getElementById('newChatBtn');
const errorBanner = document.getElementById('errorBanner');
const sidebarEl = document.getElementById('sidebar');
const sidebarToggle = document.getElementById('sidebarToggle');

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Fenced-code-block rendering with per-block Download/Save actions. Each
// block gets a unique id so its button handlers can find its raw text
// (kept in codeBlockRegistry, not re-parsed back out of rendered HTML).
let codeBlockCounter = 0;
const codeBlockRegistry = {};

function guessExtension(lang) {
  const map = { python: 'py', py: 'py', cpp: 'cpp', 'c++': 'cpp', cc: 'cpp', c: 'c', javascript: 'js', js: 'js' };
  return map[(lang || '').toLowerCase()] || 'txt';
}

function renderContent(text) {
  const parts = text.split(/```(\w*)\n?([\s\S]*?)```/g);
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 3 === 0) {
      html += escapeHtml(parts[i]);
    } else if (i % 3 === 2) {
      const lang = parts[i - 1];
      const code = parts[i];
      const blockId = `codeblock-${codeBlockCounter++}`;
      codeBlockRegistry[blockId] = { code, ext: guessExtension(lang) };
      html += `
        <div class="code-block">
          <div class="code-block-toolbar">
            <span class="code-block-lang">${escapeHtml(lang || 'text')}</span>
            <button class="code-block-btn" data-action="download" data-block="${blockId}">Download</button>
            <button class="code-block-btn" data-action="copy" data-block="${blockId}">Copy</button>
            <button class="code-block-btn" data-action="save" data-block="${blockId}">Save to project</button>
          </div>
          <pre><code>${escapeHtml(code)}</code></pre>
        </div>`;
    }
  }
  return html;
}

function downloadCodeBlock(blockId) {
  const { code, ext } = codeBlockRegistry[blockId];
  const blob = new Blob([code], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `snippet.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function flashButtonFeedback(btn, text) {
  const original = btn.textContent;
  btn.textContent = text;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1500);
}

async function copyCodeBlock(blockId, btn) {
  const { code } = codeBlockRegistry[blockId];
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(code);
    } else {
      // Fallback for contexts where the async Clipboard API isn't available
      const textarea = document.createElement('textarea');
      textarea.value = code;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }
    flashButtonFeedback(btn, 'Copied!');
  } catch (err) {
    flashButtonFeedback(btn, 'Copy failed');
  }
}

// ---------- Save-to-project modal: always asks for/confirms a filename before writing ----------
const saveModal = document.getElementById('saveModal');
const saveModalPath = document.getElementById('saveModalPath');
const saveModalConfirm = document.getElementById('saveModalConfirm');
const saveModalCancel = document.getElementById('saveModalCancel');
let pendingSaveBlockId = null;

function openSaveModal(blockId) {
  pendingSaveBlockId = blockId;
  saveModalPath.value = `snippet.${codeBlockRegistry[blockId].ext}`;
  saveModal.classList.add('open');
  saveModalPath.focus();
  saveModalPath.select();
}

function closeSaveModal() {
  saveModal.classList.remove('open');
  pendingSaveBlockId = null;
}

async function confirmSave() {
  const path = saveModalPath.value.trim();
  if (!path || !pendingSaveBlockId) return;
  const { code } = codeBlockRegistry[pendingSaveBlockId];
  try {
    const resp = await fetch('/api/save_file', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, content: code }),
    });
    const data = await resp.json();
    if (data.status === 'saved') {
      showError(`Saved to ${data.path}`);
    } else {
      showError(data.detail || 'Could not save that file.');
    }
  } catch (err) {
    showError(`Save failed: ${err.message}`);
  }
  closeSaveModal();
}

saveModalConfirm.addEventListener('click', confirmSave);
saveModalCancel.addEventListener('click', closeSaveModal);
saveModalPath.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmSave(); }
  if (e.key === 'Escape') closeSaveModal();
});

messagesEl.addEventListener('click', e => {
  const btn = e.target.closest('.code-block-btn');
  if (!btn) return;
  const blockId = btn.dataset.block;
  if (btn.dataset.action === 'download') downloadCodeBlock(blockId);
  if (btn.dataset.action === 'save') openSaveModal(blockId);
  if (btn.dataset.action === 'copy') copyCodeBlock(blockId, btn);
});

function addMessage(role, content) {
  emptyStateEl.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  let toolbarHtml = '';
  if (role === 'assistant' && content.trim()) {
    // Whole-message toolbar: works regardless of whether the response used
    // ```fences``` -- this model often doesn't, so per-fenced-block buttons
    // alone would leave plain unfenced code with no way to grab it.
    const msgBlockId = `msgblock-${codeBlockCounter++}`;
    codeBlockRegistry[msgBlockId] = { code: content, ext: 'txt' };
    toolbarHtml = `
      <div class="msg-toolbar">
        <button class="code-block-btn" data-action="download" data-block="${msgBlockId}">Download reply</button>
        <button class="code-block-btn" data-action="copy" data-block="${msgBlockId}">Copy</button>
        <button class="code-block-btn" data-action="save" data-block="${msgBlockId}">Save reply</button>
      </div>`;
  }

  msg.innerHTML = `
    <div class="msg-label">${role === 'user' ? 'you' : 'assistant'}</div>
    ${toolbarHtml}
    <div class="msg-bubble">${renderContent(content)}</div>
  `;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msg;
}

function addTypingIndicator() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'typingIndicator';
  msg.innerHTML = `
    <div class="msg-label">assistant</div>
    <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function showError(text) {
  errorBanner.innerHTML = `<div class="error-banner">${escapeHtml(text)}</div>`;
  setTimeout(() => { errorBanner.innerHTML = ''; }, 6000);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || state.sending) return;

  state.sending = true;
  sendBtn.disabled = true;
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addMessage('user', text);
  addTypingIndicator();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: state.conversationId }),
    });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();

    removeTypingIndicator();
    addMessage('assistant', data.response);
    state.conversationId = data.conversation_id;
    loadConversationList();
  } catch (err) {
    removeTypingIndicator();
    showError(`Couldn't reach the model: ${err.message}`);
  } finally {
    state.sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function startNewChat() {
  state.conversationId = null;
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyStateEl);
  emptyStateEl.style.display = 'block';
  highlightActiveConversation();
  inputEl.focus();
  if (window.innerWidth <= 720) sidebarEl.classList.remove('open');
}

function relativeTime(ts) {
  const diffMin = Math.round((Date.now() / 1000 - ts) / 60);
  if (diffMin < 1) return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  return `${Math.round(diffHr / 24)}d ago`;
}

function highlightActiveConversation() {
  document.querySelectorAll('.conv-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === state.conversationId);
  });
}

async function loadConversationList() {
  try {
    const resp = await fetch('/api/conversations');
    const conversations = await resp.json();
    if (!conversations.length) {
      convListEl.innerHTML = '<p class="conv-empty">No conversations yet.</p>';
      return;
    }
    convListEl.innerHTML = '';
    conversations.forEach(c => {
      const item = document.createElement('div');
      item.className = 'conv-item';
      item.dataset.id = c.conversation_id;
      item.tabIndex = 0;
      item.innerHTML = `
        <div class="conv-item-title">${escapeHtml(c.title || 'untitled')}</div>
        <div class="conv-item-meta">${c.message_count} messages · ${relativeTime(c.updated_at)}</div>
      `;
      item.addEventListener('click', () => openConversation(c.conversation_id));
      item.addEventListener('keydown', e => { if (e.key === 'Enter') openConversation(c.conversation_id); });
      convListEl.appendChild(item);
    });
    highlightActiveConversation();
  } catch (err) {
    convListEl.innerHTML = '<p class="conv-empty">Couldn\'t load conversation history.</p>';
  }
}

async function openConversation(id) {
  try {
    const resp = await fetch(`/api/conversations/${id}`);
    if (!resp.ok) throw new Error('not found');
    const conv = await resp.json();

    state.conversationId = id;
    messagesEl.innerHTML = '';
    emptyStateEl.style.display = 'none';
    conv.turns.forEach(t => addMessage(t.role, t.content));
    highlightActiveConversation();
    if (window.innerWidth <= 720) sidebarEl.classList.remove('open');
  } catch (err) {
    showError('Could not load that conversation.');
  }
}

async function loadStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    document.getElementById('adapterName').textContent =
      data.adapter_path ? data.adapter_path.split(/[\\/]/).pop() : 'base model';
  } catch (err) { /* non-critical */ }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
newChatBtn.addEventListener('click', startNewChat);
sidebarToggle.addEventListener('click', () => sidebarEl.classList.toggle('open'));

loadStatus();
loadConversationList();
inputEl.focus();
</script>
</body>
</html>
